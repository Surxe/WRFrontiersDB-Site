name: Set up site
description: Check out game data, install dependencies, and generate the slug map

runs:
  using: composite
  steps:
    # Data's shared checkout (public repo, no token); the build records the same
    # checkout's commit in /deploy.json.
    - name: Checkout Data Repo
      uses: Surxe/WRFrontiersDB-Data/.github/actions/checkout-data@deploy-record
      with:
        path: WRFrontiersDB-Data

    - name: Symlink WRFrontiersDB-Data to public
      shell: bash
      run: ln -s ../WRFrontiersDB-Data public/WRFrontiersDB-Data

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    # The slug map comes from the data repo (index/slug_map.json); the slug
    # collision test and astro build both read the copy in public/.
    - name: Copy slug map
      shell: bash
      run: npm run sync:slugs
